services:
  - type: web
    name: github-rag-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OPENAI_API_KEY
        value: "your_groq_api_key_here"  # Get this from console.groq.com
      - key: OPENAI_API_BASE
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL
        value: "llama3-8b-8192" # Groq's Llama 3 model name
      - key: GITHUB_TOKEN
        value: "" # Optional, add if you have one
